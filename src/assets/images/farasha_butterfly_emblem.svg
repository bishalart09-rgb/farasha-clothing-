<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 320" width="100%" height="100%">
  <defs>
    <!-- Multi-stop luxury metallic gold linear gradient -->
    <linearGradient id="emblemGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F5E4BE" />
      <stop offset="20%" stop-color="#DEBE7E" />
      <stop offset="45%" stop-color="#C5A059" />
      <stop offset="70%" stop-color="#DFCA99" />
      <stop offset="88%" stop-color="#A57F3A" />
      <stop offset="100%" stop-color="#C5A05E" />
    </linearGradient>

    <!-- Wing specular highlight gradient -->
    <linearGradient id="emblemGoldHighlight" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#FFF0D0" />
      <stop offset="30%" stop-color="#DEBE7E" />
      <stop offset="70%" stop-color="#A8823D" />
      <stop offset="100%" stop-color="#E5CF9C" />
    </linearGradient>
  </defs>

  <g transform="translate(200, 160)">
    <!-- Center Head & Antennae -->
    <ellipse cx="0" cy="-66" rx="3.5" ry="4" fill="url(#emblemGold)" />
    
    <!-- Left Antenna -->
    <path d="M -2,-68 C -12,-88 -30,-102 -54,-106 C -59,-107 -62,-103 -60,-99 C -58,-95 -54,-95 -50,-94 C -30,-90 -15,-78 -4,-64" 
          fill="none" stroke="url(#emblemGold)" stroke-width="2.2" stroke-linecap="round" />
    <circle cx="-54" cy="-105" r="3" fill="url(#emblemGold)" />

    <!-- Right Antenna -->
    <path d="M 2,-68 C 12,-88 30,-102 54,-106 C 59,-107 62,-103 60,-99 C 58,-95 54,-95 50,-94 C 30,-90 15,-78 4,-64" 
          fill="none" stroke="url(#emblemGold)" stroke-width="2.2" stroke-linecap="round" />
    <circle cx="54" cy="-105" r="3" fill="url(#emblemGold)" />

    <!-- Slender Body -->
    <path d="M -3,-60 C -1.5,-63 1.5,-63 3,-60 C 4.5,-45 4,-20 3.2,0 C 2.5,18 1.5,28 0,38 C -1.5,28 -2.5,18 -3.2,0 C -4,-20 -4.5,-45 -3,-60 Z" fill="url(#emblemGold)" />
    <circle cx="0" cy="38" r="1.2" fill="url(#emblemGold)" />

    <!-- RIGHT WINGS -->
    <g id="right-wing-emblem">
      <!-- Forewing Outer Silhouette -->
      <path d="M 4,-50
               C 22,-72 65,-108 118,-115
               C 146,-119 168,-108 170,-88
               C 172,-75 160,-52 142,-28
               C 126,-7 104,12 76,24
               C 52,34 22,34 6,24
               C 3,22 6,10 9,-2
               C 12,-15 11,-36 4,-50 Z"
            fill="url(#emblemGoldHighlight)" />

      <!-- Forewing Filigree Main Cutout -->
      <path d="M 16,-44
               C 34,-64 72,-98 116,-103
               C 138,-106 154,-97 156,-82
               C 158,-72 148,-52 133,-30
               C 120,-11 100,5 75,16
               C 54,24 28,24 14,16
               C 12,10 16,-1 18,-12
               C 20,-24 19,-35 16,-44 Z"
            fill="#FAF8F5" />

      <!-- Forewing Internal Filigree Lace Veins -->
      <path d="M 16,-36 C 42,-44 80,-54 130,-72"
            fill="none" stroke="url(#emblemGold)" stroke-width="2.6" stroke-linecap="round" />
      <path d="M 32,-42 C 58,-32 92,-20 128,-36"
            fill="none" stroke="url(#emblemGold)" stroke-width="2.2" stroke-linecap="round" />

      <!-- Inner Teardrop Petal Solid Core -->
      <path d="M 30,-45
               C 46,-58 76,-78 106,-80
               C 120,-81 128,-76 130,-67
               C 131,-60 124,-50 110,-39
               C 92,-26 68,-19 44,-17
               C 32,-16 26,-28 30,-45 Z"
            fill="url(#emblemGold)" />

      <!-- Inner Teardrop Core Cutout -->
      <path d="M 40,-41
               C 54,-52 78,-68 101,-70
               C 111,-71 116,-66 117,-61
               C 118,-56 112,-48 101,-38
               C 85,-27 64,-21 46,-20
               C 38,-19 35,-27 40,-41 Z"
            fill="#FAF8F5" />

      <!-- Delicate Vein Accents -->
      <path d="M 62,-70 C 80,-86 100,-94 122,-98"
            fill="none" stroke="url(#emblemGold)" stroke-width="1.8" stroke-linecap="round" />
      <path d="M 80,-30 C 98,-20 116,-6 135,-32"
            fill="none" stroke="url(#emblemGold)" stroke-width="1.6" stroke-linecap="round" />

      <!-- Hindwing Outer Silhouette -->
      <path d="M 5,24
               C 26,34 60,37 82,28
               C 98,22 110,8 114,-6
               C 116,0 116,12 112,24
               C 104,42 85,64 64,78
               C 45,90 28,95 14,89
               C 5,84 2,73 1,59
               C 0,44 2,33 5,24 Z"
            fill="url(#emblemGoldHighlight)" />

      <!-- Hindwing Filigree Cutout -->
      <path d="M 11,29
               C 30,38 58,40 76,31
               C 90,25 99,14 103,2
               C 104,10 100,21 92,32
               C 83,46 67,64 51,75
               C 37,84 25,86 14,81
               C 8,77 6,68 5,57
               C 4,45 7,36 11,29 Z"
            fill="#FAF8F5" />

      <!-- Hindwing Internal Veins -->
      <path d="M 11,35 C 28,44 50,51 72,49"
            fill="none" stroke="url(#emblemGold)" stroke-width="2" stroke-linecap="round" />
      <path d="M 9,49 C 23,58 42,65 56,66"
            fill="none" stroke="url(#emblemGold)" stroke-width="1.8" stroke-linecap="round" />
      <path d="M 7,62 C 16,69 27,74 38,74"
            fill="none" stroke="url(#emblemGold)" stroke-width="1.5" stroke-linecap="round" />

      <circle cx="78" cy="54" r="2" fill="url(#emblemGold)" />
      <circle cx="62" cy="71" r="1.8" fill="url(#emblemGold)" />
      <circle cx="44" cy="81" r="1.5" fill="url(#emblemGold)" />
    </g>

    <!-- LEFT WINGS (Mirrored) -->
    <use href="#right-wing-emblem" transform="scale(-1, 1)" />
  </g>
</svg>
